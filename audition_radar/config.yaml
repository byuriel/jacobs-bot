# ---------------------------------------------------------------------------
# Audition Radar config
# Everything tunable lives here. You should never need to edit the .py file
# except to add a new source *type*.
# ---------------------------------------------------------------------------

# Create in Discord: Server Settings > Integrations > Webhooks > New Webhook.
# Point it at a channel that is ONLY for this, so notifications aren't buried.
#
# This repo is public -- do NOT paste the real webhook URL here. Set it via
# the DISCORD_WEBHOOK_URL environment variable instead (it overrides this
# value at runtime). Leave this blank in git.
discord_webhook: ""

home:
  # Fontana, CA
  lat: 34.0922
  lon: -117.4350
  # 100 covers San Diego (96.4 mi). Escondido, Valencia, Thousand Oaks and
  # Oxnard also fall inside; Ventura (103.3) is the nearest city still outside.
  radius_miles: 100

runtime:
  politeness_seconds: 2.0      # pause between HTTP requests. Don't lower this.
  enrich_below_chars: 400      # if a listing has less text than this, open it

filters:
  # A listing must contain at least one of these to be considered at all.
  include:
    - vocalist
    - vocalists
    - singer
    - singers
    - "musical theatre"
    - "musical theater"
    - "open call"
    - audition
    - principal
    - "equity principal"
    - epa
    - eca
    - "cruise"
    - "theme park"
    - performer
    - actor
    - ensemble
    - "16 bar"
    - "32 bar"

  # Anything containing these is dropped outright.
  hard_exclude:
    - "unpaid"
    - "no pay"
    - "non-paying"
    - "student film"
    - "class project"
    - "college program"
    - "high school"
    - "children ages"
    - "must be under 18"
    - "must be 18-22"
    - "seeking minors"
    - "volunteer only"

  # Bumps a listing up the ordering. Doesn't gate anything.
  boost:
    - "tenor"
    - "bari-tenor"
    - "baritenor"
    - "baritone"
    - "pop/rock"
    - "contemporary"
    - "paid"
    - "per week"
    - "per month"
    - "salary"
    - "contract"
    - "principal"
    - "video submission"
    - "self-tape"

  # --- Voice type: male baritone --------------------------------------------
  #
  # Read this before tightening it. Most listings never state a voice type --
  # "seeking vocalists" is the norm, and every one of those calls is open to a
  # baritone. Requiring the word "baritone" would drop the Royal Caribbean,
  # Princess and Celebrity calls this tool exists to catch, because they
  # advertise as "Vocalists & Dancers". So:
  #
  #   names his voice type      -> keep, tagged VOICE MATCH, scored up
  #   explicitly someone else   -> dropped
  #   says nothing              -> kept (a baritone can walk into that room)
  #
  # Matching is whole-word, which matters more than it looks: "alto" is a
  # substring of Rialto, eight miles from Fontana.
  voice_match:
    - baritone
    - baritones
    - "bari-tenor"
    - "bari-tenors"
    - baritenor
    - "bass-baritone"
    - bass
    - "male presenting"
    - "male-presenting"
    - "male identifying"
    - "male-identifying"
    - "male vocalist"
    - "male vocalists"
    - "male singer"
    - "male singers"
    - "seeking men"
    - men

  # Checked only when nothing in voice_match hit, so "Tenors and Bari-tenors"
  # is safe -- the bari-tenor match wins before any of this is consulted.
  voice_exclude:
    - soprano
    - sopranos
    - mezzo
    - "mezzo-soprano"
    - alto
    - altos
    - contralto
    - countertenor
    - treble
    - "boy soprano"
    - "female only"
    - "females only"
    - "women only"
    - "seeking women"
    - "seeking females"
    - "female presenting"
    - "female-presenting"
    - "female identifying"
    - "female-identifying"
    - "must be female"
    - "all female"
    - "tenor only"
    - "tenors only"

  # Literal exclusivity: drop anything that does not explicitly name a
  # baritone or male vocalist. Off by default because it also drops every
  # "seeking vocalists" cruise call, which is most of them. Turn it on only if
  # the channel is too busy and you would rather miss calls than skim them.
  require_voice_match: false

  # Gold border in Discord + big score bump. These are the payers.
  priority_employers:
    - "royal caribbean"
    - "norwegian cruise"
    - "nclh"
    - "oceania cruises"
    - "regent seven seas"
    - "celebrity cruises"
    - "princess cruises"
    - "carnival cruise"
    - "holland america"
    - "virgin voyages"
    - "msc cruises"
    - "cunard"
    - "p&o cruises"
    - "seabourn"
    - "silversea"
    - "viking ocean"
    - "viking cruises"
    - "explora journeys"
    - "azamara"
    - "american cruise lines"
    # Casting agencies that front for the lines. Listings frequently name
    # the agency and never the cruise line, so these matter as much.
    - "pearson casting"
    - "belinda king"
    - "rws global"
    - "madorma casting"
    - "harry blumenau"
    - "leaveyourlegasea"
    - "nclh creative"
    - "carnival entertainment"
    - "princess cruises entertainment"
    - "celebrity cruises entertainment"
    - "disney cruise line"
    - "disney live entertainment"
    - "disneyland resort"
    - "walt disney world"
    - "universal studios"
    - "knott's berry farm"
    - "six flags"
    - "medieval times"
    - "cirque du soleil"
    - "la mirada"
    - "mccoy rigby"
    - "musical theatre west"
    - "3-d theatricals"
    - "moonlight stage"
    - "pasadena playhouse"
    - "center theatre group"
    - "south coast repertory"
    - "chance theater"
    - "candlelight pavilion"
    - "a noise within"

  # --- Cruise focus ---------------------------------------------------------

  priority_employer_ignores_radius: true

  # ONLY these ignore the radius, and the distinction matters. Cruise work is
  # location-independent -- you fly to the ship, so a Miami or London audition
  # stop is still a job he can take. A theme park or regional theatre call is
  # a job *in that city*: "Six Flags Holiday in the Park -- NJ Local
  # Auditions" is work in New Jersey, and exempting it from the radius (which
  # an earlier version did, by exempting every priority employer) is how
  # out-of-state pings started arriving.
  #
  # The bare word "cruise" is here on purpose: plenty of real listings say
  # "cruise ship vocalist" without ever naming the line or the agency.
  radius_exempt:
    - "cruise"
    - "royal caribbean"
    - "norwegian cruise"
    - "nclh"
    - "oceania cruises"
    - "regent seven seas"
    - "celebrity cruises"
    - "princess cruises"
    - "carnival cruise"
    - "holland america"
    - "virgin voyages"
    - "msc cruises"
    - "cunard"
    - "p&o cruises"
    - "seabourn"
    - "silversea"
    - "viking ocean"
    - "viking cruises"
    - "explora journeys"
    - "azamara"
    - "american cruise lines"
    - "pearson casting"
    - "belinda king"
    - "rws global"
    - "madorma casting"
    - "harry blumenau"
    - "leaveyourlegasea"
    - "nclh creative"

  # The geo filter deliberately fails open when it cannot parse a location.
  # Sound in principle, but 21 of 33 hits in one run were unmappable places
  # thousands of miles away -- "NJ Local Auditions", "Broward County",
  # background-extra and game-show casting. When true, an unmappable listing
  # must ALSO look like the work being hunted: a priority employer, or one of
  # signal_terms below. Set false to restore the original fail-open behaviour.
  require_signal_when_location_unknown: true

  signal_terms:
    - vocalist
    - vocalists
    - singer
    - singers
    - "sings"
    - tenor
    - baritone
    - "bari-tenor"
    - cruise
    - "cruise ship"
    - "theme park"
    - "musical theatre"
    - "musical theater"
    - "video submission"
    - "self-tape"
    - "16 bar"
    - "32 bar"

# ---------------------------------------------------------------------------
# Sources
#
# type: rss   -> just needs a feed url. Durable. Prefer these.
# type: html  -> CSS selectors. Breaks when a site redesigns; fix the
#                selector string here, not in the code.
#
# The two enabled-by-default sources are the load-bearing ones. Royal
# Caribbean's own LA call surfaced on Playbill, and AuditionsFree
# aggregates cruise and regional calls aggressively.
# ---------------------------------------------------------------------------
sources:

  - name: "AuditionsFree"
    type: rss
    url: "https://www.auditionsfree.com/feed/"
    max_items: 50
    enabled: false

  - name: "AuditionsFree — California"
    type: rss
    url: "https://www.auditionsfree.com/tag/california/feed/"
    max_items: 40
    enabled: false

  # The reason this project exists. AuditionsFree tags cruise line calls, and
  # this feed is where "Cruise Line Singer & Dancer Auditions in Los Angeles"
  # type posts land. Highest-value feed in the file.
  - name: "AuditionsFree — Cruise Lines"
    type: rss
    url: "https://www.auditionsfree.com/tag/cruise-line-auditions/feed/"
    max_items: 40
    enabled: false

  - name: "AuditionsFree — Cruise Ship Jobs"
    type: rss
    url: "https://www.auditionsfree.com/tag/cruise-ship-jobs/feed/"
    max_items: 40
    enabled: false

  - name: "Playbill Jobs — Performer"
    type: html
    url: "https://playbill.com/jobs?category=Performer"
    max_items: 60
    enabled: true
    selectors:
      item: 'a[href*="/job/"]'
      link: ""          # the item IS the anchor

  # Old URL (/losangeles/auditions.cfm) redirected to a .php that 404s. This is
  # the current path.
  - name: "BroadwayWorld — LA Auditions"
    type: html
    url: "https://www.broadwayworld.com/auditions/Los-Angeles-CA"
    max_items: 40
    enabled: true
    selectors:
      item: 'a[href*="/auditions/"]'
      link: ""

  # Virtual/self-submit calls have no geography, which is the whole lane that
  # matters for cruise work from Fontana.
  - name: "BroadwayWorld — Virtual Auditions"
    type: html
    url: "https://www.broadwayworld.com/auditions/Virtual"
    max_items: 40
    enabled: true
    selectors:
      item: 'a[href*="/auditions/"]'
      link: ""

  # Cruise-heavy aggregators. These carry lines that never post to Playbill.
  - name: "Castbee"
    type: rss
    url: "https://www.castbee.com/blog-feed.xml"
    max_items: 40
    enabled: true

  - name: "Entertainers Worldwide — Singer/Cruise"
    type: html
    url: "https://www.entertainersworldwidejobs.com/singer-jobs/cruise-ship"
    max_items: 40
    enabled: true
    selectors:
      item: 'a[href*="/singer-jobs/"]'
      link: ""

  # There is no /cruise index page -- listings live at /cruise-<slug> and are
  # indexed from /blog ("Current Castings"). The href filter keeps this to the
  # cruise posts. UK-based, so most will read OUT OF RADIUS unless the listing
  # accepts video, which cruise lines routinely do; the ones that matter name
  # Royal Caribbean, Princess, Celebrity, P&O and Disney Cruise Line.
  - name: "Open Auditions UK — Cruise"
    type: html
    url: "https://www.openauditions.uk/blog"
    max_items: 30
    enabled: true
    selectors:
      item: 'a[href*="/cruise"]'
      link: ""

  # --- Needs work before enabling -------------------------------------------
  # These render their listings with JavaScript, so a plain GET returns an
  # empty shell. Two ways to fix, in order of effort:
  #   1. Open the page in Chrome DevTools > Network > XHR, find the JSON
  #      endpoint the page calls, and point a source at that instead.
  #   2. Add a Playwright fetcher (pip install playwright && playwright
  #      install chromium) and a "type: browser" entry in FETCHERS.
  # Until then, their calls still reach you via Playbill and AuditionsFree,
  # which is how the Aug 18 LA call surfaced in the first place.

  - name: "Royal Caribbean — Upcoming Auditions"
    type: html
    url: "https://royalcaribbeanentertainment.com/productions/upcoming-auditions/"
    enabled: false
    selectors:
      item: ".audition-card"
      link: "a"
      title: ".audition-title"
      location: ".audition-location"

  - name: "Disney Auditions"
    type: html
    url: "https://jobs.disneycareers.com/auditions"
    enabled: false
    selectors:
      item: ".job-listing"
      link: "a"

  - name: "Actors' Equity Casting Call"
    type: html
    url: "https://castingcall.actorsequity.org/"
    enabled: false
    selectors:
      item: ".casting-notice"
      link: "a"
